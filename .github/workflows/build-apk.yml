name: Build VaultBridge Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: ./mobile-emergency-bridge/android-client
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_output.txt
        continue-on-error: true

      - name: Publish Build Result to Summary
        run: |
          echo "## Gradle Build Output" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 /tmp/gradle_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "BUILD SUCCESSFUL" /tmp/gradle_output.txt; then
            echo "Build successful!"
          else
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VaultBridge-Emergency-App
          path: mobile-emergency-bridge/android-client/app/build/outputs/apk/debug/*.apk
